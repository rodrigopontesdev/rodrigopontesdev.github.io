<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm" style="max-width: 400px; width: 100%;">
    <div class="card-header bg-primary text-white text-center">
        <h5>Cadastro de Acesso</h5>
    </div>
    <div class="card-body">
        <div id="msg"></div>
        <form id="formCadastroGeral">
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <!-- Removida a restrição de domínio -->
                <input type="email" id="email" class="form-control" placeholder="seu.email@exemplo.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="senha" class="form-control" minlength="6" required>
            </div>
            <button type="submit" id="btnCadastrar" class="btn btn-primary w-100">Solicitar Acesso</button>
        </form>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCU8eHaEmW0e010rddizi5HRvMZRLElG-M",
        authDomain: "cadastro-intimacoes.firebaseapp.com",
        projectId: "cadastro-intimacoes",
        storageBucket: "cadastro-intimacoes.firebasestorage.app",
        messagingSenderId: "990693838991",
        appId: "1:990693838991:web:d65f2259b764fec8d920fa"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById("formCadastroGeral").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        const btn = document.getElementById("btnCadastrar");
        
        const nome = document.getElementById("nome").value;
        // Apenas padroniza para minúsculas e remove espaços
        const email = document.getElementById("email").value.toLowerCase().trim();
        const senha = document.getElementById("senha").value;

        try {
            btn.disabled = true;
            msg.innerHTML = '<div class="alert alert-info">Processando cadastro...</div>';

            // 1. Cria Auth (qualquer e-mail válido é aceito)
            const userCredential = await createUserWithEmailAndPassword(auth, email, senha);
            
            // 2. Cria documento com role 'pendente'
            await setDoc(doc(db, "funcionarios", userCredential.user.uid), {
                nome: nome,
                email: email,
                role: "pendente", 
                status: "aguardando_aprovacao",
                criadoEm: serverTimestamp()
            });

            msg.innerHTML = '<div class="alert alert-success">Cadastro realizado! Aguarde a aprovação do Super Admin.</div>';
            document.getElementById("formCadastroGeral").reset();

        } catch (error) {
            console.error(error);
            let erroMsg = "Erro ao cadastrar.";
            if (error.code === 'auth/email-already-in-use') erroMsg = "Este e-mail já possui uma conta.";
            if (error.code === 'auth/weak-password') erroMsg = "Senha muito fraca (mínimo 6 caracteres).";
            if (error.code === 'auth/invalid-email') erroMsg = "Formato de e-mail inválido.";
            
            msg.innerHTML = `<div class="alert alert-danger">${erroMsg}</div>`;
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
