<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            background-color: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .top-header {
            background: #198754;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .top-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .top-header p {
            margin: 2px 0;
            font-size: .95rem;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .cadastro-card {
            width: 100%;
            max-width: 650px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .cadastro-card .card-body {
            padding: 35px;
        }

        .titulo-cadastro {
            text-align: center;
            color: #198754;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .footer {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: .9rem;
        }

        .form-label {
            font-weight: 600;
        }

        @media (max-width: 576px) {
            .cadastro-card .card-body {
                padding: 25px;
            }

            .top-header h1 {
                font-size: 1.2rem;
            }

            .top-header p {
                font-size: .85rem;
            }
        }
    </style>
</head>
<body>

<header class="top-header">

    <h1>2º Tabelionato de Protestos</h1>

    <p>Rua dos Andradas, 1234 - 4º Andar - Porto Alegre - RS</p>

    <p>CNPJ: 04.438.173/0001-47</p>

    <p>Horário de Atendimento: 09h às 17h</p>

</header>

<main class="main-content">

    <div class="card cadastro-card">

        <div class="card-body">

            <h3 class="titulo-cadastro">
                Solicitação de Cadastro
            </h3>

            <div id="mensagemSistema"></div>

            <form id="formCadastro">

                <div class="mb-3">

                    <label for="nomeCompleto" class="form-label">
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nomeCompleto"
                        required>

                </div>

                <div class="mb-3">

                    <label for="emailGoogle" class="form-label">
                        E-mail Google
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="emailGoogle"
                        placeholder="seuemail@gmail.com"
                        required>

                </div>

                <div class="mb-3">

                    <label for="celular" class="form-label">
                        Celular
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        id="celular"
                        maxlength="15"
                        placeholder="(51) 99999-9999"
                        required>

                    <div class="form-text">
                        Informe o número com DDD.
                    </div>

                </div>

                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="aceiteTermos"
                        required>

                    <label
                        class="form-check-label"
                        for="aceiteTermos">

                        Estou ciente de que meu acesso dependerá de aprovação administrativa.

                    </label>

                </div>

                <div class="d-grid gap-2">

                    <button
                        type="submit"
                        id="btnSolicitarCadastro"
                        class="btn btn-success btn-lg">

                        Enviar Solicitação

                    </button>

                    <a
                        href="index.html"
                        class="btn btn-outline-secondary">

                        Voltar para Login

                    </a>

                </div>

            </form>

        </div>

    </div>

</main>

<footer class="footer">
    © <span id="anoAtual"></span> 2º Tabelionato de Protestos. Todos os direitos reservados.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/firebase.js"></script>
<script src="js/app.js"></script>

<script>

document.getElementById("anoAtual").textContent =
new Date().getFullYear();

const celular = document.getElementById("celular");

celular.addEventListener("input", function () {

    let valor = this.value.replace(/\D/g, "");

    valor = valor.replace(/^(\d{2})(\d)/g, "($1) $2");
    valor = valor.replace(/(\d{5})(\d)/, "$1-$2");

    this.value = valor;

});

document
.getElementById("formCadastro")
.addEventListener("submit", function(e){

    e.preventDefault();

    // Firebase Firestore
    // Implementaremos posteriormente

    console.log("Solicitação enviada");

});

</script>

</body>
</html>
