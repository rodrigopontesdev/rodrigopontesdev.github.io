<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2º Tabelionato de Protestos - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            background-color: #ffffff;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .top-header {
            background: #198754;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .top-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .top-header p {
            margin: 2px 0;
            font-size: .95rem;
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        .login-card .card-body {
            padding: 40px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px;
            color: #198754;
            font-weight: 700;
        }

        .btn-google {
            background: #ffffff;
            border: 1px solid #dadce0;
            color: #444;
            font-weight: 600;
        }

        .btn-google:hover {
            background: #f8f9fa;
        }

        .footer {
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
            text-align: center;
            padding: 15px;
            font-size: .9rem;
            color: #666;
        }

        @media (max-width: 576px) {
            .top-header h1 {
                font-size: 1.2rem;
            }

            .top-header p {
                font-size: .85rem;
            }

            .login-card .card-body {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <h1>2º Tabelionato de Protestos</h1>

        <p>Rua dos Andradas, 1234 - 4º Andar - Porto Alegre - RS</p>
        <p>CNPJ: 04.438.173/0001-47</p>
        <p>Horário de Atendimento: 09h às 17h</p>
    </header>

    <main class="main-content">

        <div class="card login-card">

            <div class="card-body">

                <h3 class="login-title">
                    Acesso ao Sistema
                </h3>

                <div class="d-grid mb-3">

                    <button
                        id="btnGoogleLogin"
                        class="btn btn-google btn-lg">

                        Entrar com Google

                    </button>

                </div>

                <div class="d-grid">

                    <a
                        href="cadastro.html"
                        class="btn btn-success btn-lg">

                        Solicitar Cadastro

                    </a>

                </div>

            </div>

        </div>

    </main>

    <footer class="footer">
        © <span id="anoAtual"></span> 2º Tabelionato de Protestos. Todos os direitos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        document.getElementById('anoAtual').textContent =
            new Date().getFullYear();

        const btnGoogleLogin =
            document.getElementById('btnGoogleLogin');

        btnGoogleLogin.addEventListener('click', () => {

            // Firebase Authentication

            console.log('Login Google');

        });

    </script>

</body>
</html>
