<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Importação de Clientes</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

body{
    background:#f4f6f9;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header-cartorio{
    background:#198754;
    color:#fff;
    padding:20px;
}

.header-cartorio h1{
    font-size:1.5rem;
    margin-bottom:8px;
    font-weight:700;
}

.main-content{
    flex:1;
    padding:30px 15px;
}

.card-formulario{
    max-width:900px;
    margin:auto;
    border:none;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.card-header-custom{
    background:#198754;
    color:#fff;
    font-weight:600;
    border-radius:15px 15px 0 0 !important;
}

.footer{
    background:#fff;
    border-top:1px solid #ddd;
    text-align:center;
    padding:15px;
    margin-top:auto;
}

#mensagemSistema{
    min-height:50px;
}

.upload-area{
    border:2px dashed #198754;
    border-radius:10px;
    padding:40px 20px;
    text-align:center;
    cursor:pointer;
    transition:all .3s ease;
}

.upload-area:hover{
    background:#f0fdf4;
}

.btn-upload{
    min-width:180px;
}

</style>
</head>
<body>

<header class="header-cartorio">
    <h1>2º Tabelionato de Protestos</h1>
    <div>Rua dos Andradas, 1234 - 4º Andar - Porto Alegre - RS</div>
    <div>CNPJ: 04.438.173/0001-47</div>
    <div>Horário: 09h às 17h</div>
</header>

<main class="main-content">
    <div class="card card-formulario">
        <div class="card-header card-header-custom">
            Importação de Clientes
        </div>
        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="inputCsv" class="form-label fw-bold">Importar CSV</label>
                    <input type="file" id="inputCsv" accept=".csv" class="form-control">
                </div>
                <div class="col-md-6">
                    <label for="inputJson" class="form-label fw-bold">Importar JSON</label>
                    <input type="file" id="inputJson" accept=".json" class="form-control">
                </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-success btn-lg btn-upload" id="btnProcessar" disabled>
                    Processar e Cadastrar
                </button>
            </div>

            <div id="mensagemSistema" class="mt-4 alert d-none"></div>

        </div>
    </div>
</main>

<footer class="footer">
    © <span id="anoAtual"></span> 2º Tabelionato de Protestos
</footer>

<script>
document.getElementById('anoAtual').textContent = new Date().getFullYear();

const SUPABASE_URL = 'https://idcntslmjikqarutsmsb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Esc3bs1bfOkHAcmuFXUsQQ_SiDJnAOM';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let dadosParseados = [];
let tipoArquivoAtual = null;

const inputCsv = document.getElementById('inputCsv');
const inputJson = document.getElementById('inputJson');
const btnProcessar = document.getElementById('btnProcessar');
const mensagemSistema = document.getElementById('mensagemSistema');

function mostrarMensagem(texto, tipo) {
    mensagemSistema.className = `mt-4 alert alert-${tipo}`;
    mensagemSistema.textContent = texto;
    mensagemSistema.classList.remove('d-none');
}

function limparMensagem() {
    mensagemSistema.classList.add('d-none');
    mensagemSistema.textContent = '';
}

function normalizarDados(dadosBrutos) {
    const camposValidos = ['devedor', 'cpf_cnpj', 'cep', 'endereco'];
    return dadosBrutos.map(linha => {
        const objLimpo = {};
        for (const campo of camposValidos) {
            if (linha[campo] !== undefined && linha[campo] !== null) {
                objLimpo[campo] = String(linha[campo]).trim();
            }
        }
        return objLimpo;
    }).filter(obj => Object.keys(obj).length > 0);
}

async function processarCSV(file) {
    return new Promise((resolve, reject) => {
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => resolve(normalizarDados(results.data)),
            error: (err) => reject(err)
        });
    });
}

async function processarJSON(file) {
    const texto = await file.text();
    let dados = JSON.parse(texto);
    if (!Array.isArray(dados)) dados = [dados];
    return normalizarDados(dados);
}

async function handleFileSelect(event, tipo) {
    limparMensagem();
    dadosParseados = [];
    tipoArquivoAtual = null;
    btnProcessar.disabled = true;

    const file = event.target.files[0];
    if (!file) return;

    try {
        if (tipo === 'csv') {
            dadosParseados = await processarCSV(file);
        } else {
            dadosParseados = await processarJSON(file);
        }

        if (dadosParseados.length === 0) {
            mostrarMensagem('Nenhum dado válido encontrado no arquivo.', 'warning');
            return;
        }

        tipoArquivoAtual = tipo;
        btnProcessar.disabled = false;
        mostrarMensagem(`${dadosParseados.length} registro(s) carregado(s) com sucesso. Clique em "Processar e Cadastrar".`, 'info');

    } catch (err) {
        console.error(err);
        mostrarMensagem('Erro ao ler o arquivo. Verifique o formato.', 'danger');
    }
}

async function cadastrarNoSupabase() {
    if (dadosParseados.length === 0) return;

    btnProcessar.disabled = true;
    btnProcessar.textContent = 'Cadastrando...';
    limparMensagem();

    try {
        const { data, error } = await supabase
            .from('clientes')
            .insert(dadosParseados)
            .select();

        if (error) throw error;

        mostrarMensagem(`${data.length} cliente(s) cadastrado(s) com sucesso!`, 'success');
        dadosParseados = [];
        tipoArquivoAtual = null;
        inputCsv.value = '';
        inputJson.value = '';

    } catch (err) {
        console.error(err);
        mostrarMensagem(`Erro ao cadastrar: ${err.message}`, 'danger');
    } finally {
        btnProcessar.textContent = 'Processar e Cadastrar';
        btnProcessar.disabled = true;
    }
}

inputCsv.addEventListener('change', (e) => handleFileSelect(e, 'csv'));
inputJson.addEventListener('change', (e) => handleFileSelect(e, 'json'));
btnProcessar.addEventListener('click', cadastrarNoSupabase);
</script>

</body>
</html>
