<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Intimações</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header-cartorio{
    background:#198754;
    color:#fff;
    padding:20px;
}

.header-cartorio h1{
    font-size:1.5rem;
    margin-bottom:8px;
    font-weight:700;
}

.main-content{
    flex:1;
    padding:30px 15px;
}

.card-formulario{
    max-width:900px;
    margin:auto;
    border:none;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.card-header-custom{
    background:#198754;
    color:#fff;
    font-weight:600;
    border-radius:15px 15px 0 0 !important;
}

.form-label{
    font-weight:600;
}

.footer{
    background:#fff;
    border-top:1px solid #ddd;
    text-align:center;
    padding:15px;
    margin-top:auto;
}

#mensagemSistema{
    min-height:50px;
}

</style>
</head>
<body>

<header class="header-cartorio">

    <h1>2º Tabelionato de Protestos</h1>

    <div>
        Rua dos Andradas, 1234 - 4º Andar - Porto Alegre - RS
    </div>

    <div>
        CNPJ: 04.438.173/0001-47
    </div>

    <div>
        Horário: 09h às 17h
    </div>

</header>

<main class="main-content">

    <div class="card card-formulario">

        <div class="card-header card-header-custom">
            Cadastro de Intimação
        </div>

        <div class="card-body">

            <form id="formIntimacao">

                <div class="mb-3">
                    <label for="devedor" class="form-label">
                        Devedor *
                    </label>
                    <input
                        type="text"
                        class="form-control"
                        id="devedor"
                        placeholder="Nome da empresa ou pessoa física">
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Tipo de Documento *
                    </label>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="radio"
                            name="tipoDocumento"
                            id="tipoDocumentoCpf"
                            value="cpf">

                        <label
                            class="form-check-label"
                            for="tipoDocumentoCpf">
                            CPF
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="radio"
                            name="tipoDocumento"
                            id="tipoDocumentoCnpj"
                            value="cnpj">

                        <label
                            class="form-check-label"
                            for="tipoDocumentoCnpj">
                            CNPJ
                        </label>
                    </div>

                </div>

                <div class="mb-3">
                    <label for="documento" class="form-label">
                        CPF / CNPJ *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="documento"
                        placeholder="Digite o CPF ou CNPJ">
                </div>

                <div class="mb-3">
                    <label for="endereco" class="form-label">
                        Endereço *
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="endereco"
                        placeholder="Nome da rua, avenida, travessa etc.">
                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label for="numero" class="form-label">
                            Número *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="numero"
                            placeholder="Número">
                    </div>

                    <div class="col-md-8 mb-3">

                        <label for="complemento" class="form-label">
                            Complemento
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="complemento"
                            placeholder="Sala, andar, fundos, bloco...">
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label for="cep" class="form-label">
                            CEP *
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="cep"
                            placeholder="00000-000">
                    </div>

                    <div class="col-md-6 mb-3">

                        <label for="telefone" class="form-label">
                            Telefone
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="telefone"
                            placeholder="(00) 00000-0000">
                    </div>

                </div>

                <div class="mb-3">

                    <label for="observacoes" class="form-label">
                        Observações
                    </label>

                    <textarea
                        class="form-control"
                        id="observacoes"
                        rows="4"
                        placeholder="Informações adicionais"></textarea>

                </div>

                <div class="d-grid">

                    <button
                        type="button"
                        class="btn btn-success btn-lg"
                        id="btnCadastrar">

                        Cadastrar Intimação

                    </button>

                </div>

            </form>

            <div
                id="mensagemSistema"
                class="mt-4">
            </div>

        </div>

    </div>

</main>

<footer class="footer">
    © <span id="anoAtual"></span> 2º Tabelionato de Protestos
</footer>

<script>

document.getElementById('anoAtual').textContent =
new Date().getFullYear();

/*
    Integração futura:

    Firestore:
    - Cadastro da intimação

    JS:
    - Validação
    - Máscaras CPF/CNPJ
    - Máscara CEP
    - Máscara Telefone
    - Feedback visual
*/

</script>

</body>
</html>
