```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel do Intimador</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f6f9;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.header-cartorio{
    background:#198754;
    color:#fff;
    text-align:center;
    padding:20px;
}

.header-cartorio h1{
    font-size:1.4rem;
    font-weight:700;
    margin-bottom:10px;
}

.main-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

.phone-frame{
    width:390px;
    max-width:100%;
    height:780px;
    background:#fff;
    border:12px solid #222;
    border-radius:35px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    position:relative;
}

.phone-notch{
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:140px;
    height:25px;
    background:#222;
    border-bottom-left-radius:15px;
    border-bottom-right-radius:15px;
    z-index:10;
}

.app-header{
    background:#198754;
    color:#fff;
    text-align:center;
    padding:35px 15px 15px;
}

.app-body{
    height:calc(100% - 95px);
    overflow-y:auto;
    padding:15px;
}

.card-intimacao{
    border:none;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:15px;
}

.log-box{
    background:#f8f9fa;
    border-radius:12px;
    padding:10px;
    font-size:.85rem;
    max-height:180px;
    overflow:auto;
}

.status-box{
    border-radius:12px;
    padding:12px;
    background:#e9f7ef;
    border:1px solid #198754;
}

.hidden{
    display:none;
}

.footer{
    background:#fff;
    border-top:1px solid #ddd;
    text-align:center;
    padding:10px;
    font-size:.9rem;
}

</style>
</head>

<body>

<header class="header-cartorio">

    <h1>2º Tabelionato de Protestos</h1>

    <div>Rua dos Andradas, 1234 - 4º Andar - Porto Alegre - RS</div>

</header>

<div class="main-container">

    <div class="phone-frame">

        <div class="phone-notch"></div>

        <div class="app-header">

            <h5 class="mb-1">João da Silva</h5>

            <small>Intimador</small>

        </div>

        <div class="app-body">

            <!-- LISTA -->

            <div id="listaTela">

                <h5 class="mb-3">Intimações Disponíveis</h5>

                <div id="listaIntimacoes"></div>

            </div>

            <!-- DILIGÊNCIA -->

            <div id="diligenciaTela" class="hidden">

                <div class="status-box mb-3">

                    <strong id="tituloDiligencia"></strong>

                    <div id="dadosDiligencia"></div>

                </div>

                <div class="d-grid gap-2 mb-3">

                    <button class="btn btn-outline-primary" id="btnCheckpoint1">
                        Checkpoint 1
                    </button>

                    <button class="btn btn-outline-primary" id="btnCheckpoint2">
                        Checkpoint 2
                    </button>

                    <button class="btn btn-outline-primary" id="btnCheckpoint3">
                        Checkpoint 3
                    </button>

                </div>

                <div class="log-box mb-3" id="logEventos"></div>

                <div class="d-grid gap-2">

                    <button class="btn btn-success" id="btnEntregue">
                        Entrega Concluída
                    </button>

                    <button class="btn btn-warning" id="btnPendente">
                        Entrega Pendente
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="footer">
    © <span id="ano"></span> 2º Tabelionato de Protestos
</footer>

<script>

document.getElementById("ano").textContent =
new Date().getFullYear();

const intimacoes = [

{
id:"INT-0001",
nome:"Empresa Alpha Ltda",
endereco:"Rua dos Andradas, 123"
},

{
id:"INT-0002",
nome:"João Pereira",
endereco:"Av. Borges de Medeiros, 450"
},

{
id:"INT-0003",
nome:"Mercado Central",
endereco:"Rua Sete de Setembro, 890"
}

];

let diligenciaAtual = null;

const listaTela =
document.getElementById("listaTela");

const diligenciaTela =
document.getElementById("diligenciaTela");

const listaIntimacoes =
document.getElementById("listaIntimacoes");

const logEventos =
document.getElementById("logEventos");

function carregarLista(){

    listaIntimacoes.innerHTML = "";

    intimacoes.forEach((item,index)=>{

        listaIntimacoes.innerHTML += `
        <div class="card card-intimacao">
            <div class="card-body">

                <h6>${item.id}</h6>

                <div>${item.nome}</div>

                <small>${item.endereco}</small>

                <div class="mt-3">

                    <button
                    class="btn btn-success w-100"
                    onclick="iniciarDiligencia(${index})">

                    Iniciar Diligência

                    </button>

                </div>

            </div>
        </div>
        `;

    });

}

function horaAtual(){

    return new Date().toLocaleTimeString();

}

function gpsFake(){

    const lat =
    (-30 + Math.random()).toFixed(6);

    const lng =
    (-51 + Math.random()).toFixed(6);

    return {
        lat,
        lng
    };

}

function registrar(msg){

    logEventos.innerHTML += `
        <div class="mb-2">
            ${msg}
        </div>
    `;

    logEventos.scrollTop =
    logEventos.scrollHeight;

}

function iniciarDiligencia(index){

    diligenciaAtual =
    intimacoes[index];

    listaTela.classList.add("hidden");

    diligenciaTela.classList.remove("hidden");

    document.getElementById("tituloDiligencia")
    .textContent =
    diligenciaAtual.id;

    document.getElementById("dadosDiligencia")
    .innerHTML = `
        <strong>${diligenciaAtual.nome}</strong>
        <br>
        ${diligenciaAtual.endereco}
    `;

    logEventos.innerHTML = "";

    const gps = gpsFake();

    registrar(
        `🟢 Diligência iniciada às ${horaAtual()}
        <br>Lat: ${gps.lat}
        <br>Lng: ${gps.lng}`
    );

}

function registrarCheckpoint(numero){

    const gps = gpsFake();

    registrar(
        `📍 Checkpoint ${numero}
        <br>${horaAtual()}
        <br>Lat: ${gps.lat}
        <br>Lng: ${gps.lng}`
    );

}

document
.getElementById("btnCheckpoint1")
.onclick =
()=> registrarCheckpoint(1);

document
.getElementById("btnCheckpoint2")
.onclick =
()=> registrarCheckpoint(2);

document
.getElementById("btnCheckpoint3")
.onclick =
()=> registrarCheckpoint(3);

function finalizar(status){

    const gps = gpsFake();

    registrar(
        `🏁 Diligência encerrada
        <br>Status: ${status}
        <br>${horaAtual()}
        <br>Lat: ${gps.lat}
        <br>Lng: ${gps.lng}`
    );

    setTimeout(()=>{

        alert(
            `Diligência finalizada: ${status}`
        );

        listaTela.classList.remove("hidden");

        diligenciaTela.classList.add("hidden");

    },1500);

}

document
.getElementById("btnEntregue")
.onclick =
()=> finalizar("ENTREGUE");

document
.getElementById("btnPendente")
.onclick =
()=> finalizar("PENDENTE");

carregarLista();

</script>

</body>
</html>
```
