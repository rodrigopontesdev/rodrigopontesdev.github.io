<main>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

        <div class="card shadow-sm p-4" style="width:100%; max-width:400px;">

            <h3 class="text-center mb-4">

            <div class="mb-3">
                <label for="password" class="form-label">
                    Nova senha
                </label>

                <input 
                    type="password" 
                    class="form-control" 
                    id="password"
                    placeholder="Digite a nova senha">
            </div>


            <div class="mb-3">
                <label for="confirmPassword" class="form-label">
                    Confirmar senha
                </label>

                <input 
                    type="password" 
                    class="form-control" 
                    id="confirmPassword"
                    placeholder="Confirme a nova senha">
            </div>


            <button 
                id="btnSalvar"
                class="btn btn-primary w-100">
                Salvar nova senha
            </button>


            <div 
                id="message" 
                class="mt-3 text-center">
            </div>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = 'https://idcntslmjikqarutsmsb.supabase.co';

const supabaseKey = 'sb_publishable_Esc3bs1bfOkHAcmuFXUsQQ_SiDJnAOM';


const supabase = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
);



document.getElementById('btnSalvar').addEventListener('click', async () => {


    const password = document.getElementById('password').value;

    const confirmPassword = document.getElementById('confirmPassword').value;

    const message = document.getElementById('message');



    if(password.length < 6){

        message.innerHTML = "A senha deve ter pelo menos 6 caracteres.";
        message.className = "mt-3 text-center text-danger";

        return;

    }



    if(password !== confirmPassword){

        message.innerHTML = "As senhas não coincidem.";
        message.className = "mt-3 text-center text-danger";

        return;

    }



    message.innerHTML = "Alterando senha...";



    const { data, error } = await supabase.auth.updateUser({

        password: password

    });



    if(error){

        message.innerHTML = "Erro: " + error.message;
        message.className = "mt-3 text-center text-danger";

        return;

    }



    message.innerHTML = "Senha alterada com sucesso!";

    message.className = "mt-3 text-center text-success";


    setTimeout(() => {

        window.location.href = "login.html";

    }, 2000);



});


</script>
